name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Unzip project and add models
        id: proj
        run: |
          base="."
          z=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -n "$z" ]; then
            mkdir -p _project
            unzip -q "$z" -d _project
            base="_project"
          fi
          f=$(find "$base" -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts পাওয়া যায়নি।"
            ls -R | head -60
            exit 1
          fi
          dir=$(dirname "$f")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          mkdir -p "$dir/app/src/main/assets/models"
          if [ -f realesr-general-x4v3.onnx ]; then cp realesr-general-x4v3.onnx "$dir/app/src/main/assets/models/image_model.onnx"; fi
          if [ -f image_model.onnx ]; then cp image_model.onnx "$dir/app/src/main/assets/models/image_model.onnx"; fi
          if [ -f face_model.onnx ]; then cp face_model.onnx "$dir/app/src/main/assets/models/face_model.onnx"; fi
          ls -la "$dir/app/src/main/assets/models"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create debug keystore
        working-directory: ${{ steps.proj.outputs.dir }}
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lamini-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" lamini-build-${{ github.run_number }}.apk
          gh release create "build-${{ github.run_number }}" "lamini-build-${{ github.run_number }}.apk" --title "Build ${{ github.run_number }}" --notes "Auto-built debug APK" --target "${{ github.sha }}"
