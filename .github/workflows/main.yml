name: Build APK from ZIP

on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_NAME: Surokar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ZIP খুলে প্রজেক্ট বের করা
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::রিপোর মূল ফোল্ডারে কোনো .zip ফাইল নেই। প্রজেক্টের ZIP আপলোড করো।"
            exit 1
          fi
          echo "ব্যবহার হচ্ছে: ${zips[0]}"
          mkdir -p "$GITHUB_WORKSPACE/_project"
          unzip -q -o "${zips[0]}" -d "$GITHUB_WORKSPACE/_project"
          SETTINGS=$(find "$GITHUB_WORKSPACE/_project" -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP-এর ভেতরে settings.gradle পাওয়া যায়নি"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: ভার্সন ঠিক করা
        run: |
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Debug APK বানানো
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: APK গুছিয়ে রাখা
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "dist/${APP_NAME}-v${VERSION_NAME}.apk"
          {
            echo "## ✅ ${APP_NAME} APK তৈরি হয়েছে"
            echo ""
            echo "| ফাইল | সাইজ |"
            echo "|---|---|"
            for f in dist/*.apk; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
